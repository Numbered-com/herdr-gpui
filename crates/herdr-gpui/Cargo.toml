[package]
name = "herdr-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
gpui = { workspace = true, features = ["runtime_shaders"] }
herdr-client.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
ureq.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
tempfile.workspace = true
tar.workspace = true
flate2.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[features]
integration-test = ["dep:cocoa", "dep:objc", "dep:core-graphics", "dep:foreign-types", "dep:raw-window-handle"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
cocoa = { workspace = true, optional = true }
objc = { workspace = true, optional = true }
core-graphics = { workspace = true, optional = true }
foreign-types = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }

[[test]]
name = "live_gui"
required-features = ["integration-test"]

[[test]]
name = "performance_gui"
required-features = ["integration-test"]
