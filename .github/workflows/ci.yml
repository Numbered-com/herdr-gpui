name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny by default; every job below declares the scopes it actually needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Audits the workflows themselves for injection, over-broad permissions,
  # unpinned actions, and credential persistence. Gates the application
  # jobs to catch workflow mistakes early; approval/ref protection remains the
  # credential boundary, not the scanner.
  zizmor:
    if: >-
      github.repository == 'penso/herdr-gpui' &&
      github.actor == 'penso' && github.triggering_actor == 'penso' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'penso' &&
        github.event.pull_request.head.repo.full_name == 'penso/herdr-gpui') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          online-audits: false

  checks:
    if: >-
      github.repository == 'penso/herdr-gpui' &&
      github.actor == 'penso' && github.triggering_actor == 'penso' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'penso' &&
        github.event.pull_request.head.repo.full_name == 'penso/herdr-gpui') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    name: Format, lint, and test (${{ matrix.runner }})
    needs: zizmor
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps.sh
      - name: Test release scripts and security contracts without credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
          jq --version
          python3 -m unittest discover -s scripts/release/tests -v
          python3 scripts/release/test-release-security.py
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint every target and feature
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test default features and executable CLI
        run: cargo test --locked --workspace
      - name: Test integration-feature build and executable CLI
        run: cargo test --locked --workspace --all-features

  # Windows has no runner in `checks`: the GUI is unproven there and its tests
  # need a desktop session. This job type-checks every target and feature for
  # Windows and runs the two platform-independent crates' suites, which is what
  # keeps the `cfg` split honest as the code changes. It does not link the
  # executable; add `cargo build --locked --release -p herdr-gpui` here once a
  # Windows release is actually shipped.
  windows:
    if: >-
      github.repository == 'penso/herdr-gpui' &&
      github.actor == 'penso' && github.triggering_actor == 'penso' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'penso' &&
        github.event.pull_request.head.repo.full_name == 'penso/herdr-gpui') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    name: Windows check
    needs: zizmor
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint every target and feature
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test the protocol and client crates
        run: cargo test --locked -p herdr-protocol -p herdr-client

  # Keep the branch-protection context stable while requiring every platform.
  checks-passed:
    name: Format, lint, and test
    needs: checks
    if: >-
      always() &&
      github.repository == 'penso/herdr-gpui' &&
      github.actor == 'penso' && github.triggering_actor == 'penso' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'penso' &&
        github.event.pull_request.head.repo.full_name == 'penso/herdr-gpui') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all platform checks
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success

  build:
    if: >-
      github.repository == 'penso/herdr-gpui' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    name: Release (${{ matrix.runner }}, ${{ matrix.arch }})
    needs: zizmor
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps.sh
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build optimized native executable
        run: cargo build --locked --release -p herdr-gpui
      - name: Exercise release executable without opening a window
        run: cargo test --locked --release -p herdr-gpui --test cli
