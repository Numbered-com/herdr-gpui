name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny by default; every job below declares the scopes it actually needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Audits the workflows themselves for injection, over-broad permissions,
  # unpinned actions, and credential persistence. Gates the expensive macOS
  # jobs to catch workflow mistakes early; approval/ref protection remains the
  # credential boundary, not the scanner.
  zizmor:
    if: >-
      github.repository == 'penso/herdr-gpui' &&
      github.actor == 'penso' && github.triggering_actor == 'penso' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'penso' &&
        github.event.pull_request.head.repo.full_name == 'penso/herdr-gpui') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@135698455da5c3b3e55f73f4419e481ab68cdd95 # v0.4.1
        with:
          advanced-security: false
          online-audits: false

  checks:
    if: >-
      github.repository == 'penso/herdr-gpui' &&
      github.actor == 'penso' && github.triggering_actor == 'penso' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'penso' &&
        github.event.pull_request.head.repo.full_name == 'penso/herdr-gpui') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    name: Format, lint, and test
    needs: zizmor
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test release scripts and security contracts without credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
          jq --version
          python3 -m unittest discover -s scripts/release/tests -v
          python3 scripts/release/test-release-security.py
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint every target and feature
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test default features and executable CLI
        run: cargo test --locked --workspace
      - name: Test integration-feature build and executable CLI
        run: cargo test --locked --workspace --all-features

  build:
    if: >-
      github.repository == 'penso/herdr-gpui' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    name: Release (${{ matrix.arch }})
    needs: zizmor
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build optimized native executable
        run: cargo build --locked --release -p herdr-gpui
      - name: Exercise release executable without opening a window
        run: cargo test --locked --release -p herdr-gpui --test cli
