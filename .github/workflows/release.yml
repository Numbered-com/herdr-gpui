name: Release
run-name: Release ${{ inputs.VERSION }} @ ${{ inputs.expected_sha }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: Workspace version (X.Y.Z, no v or leading zeros)
        required: true
        type: string
      expected_sha:
        description: Full commit SHA of main HEAD
        required: true
        type: string
      request_id:
        description: Optional unique dispatch correlation ID (set by just release)
        required: false
        default: ''
        type: string

permissions: {}

# Serialize publication and tap updates across versions; never cancel a signer.
concurrency:
  group: manual-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Release Workflow Security
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'penso/herdr-gpui' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          online-audits: false

  validate:
    needs: audit
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'penso/herdr-gpui' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.VERSION }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[a-zA-Z0-9-]{0,64}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(gh api repos/penso/herdr-gpui/git/ref/heads/main --jq .object.sha)" == "$EXPECTED_SHA" ]]
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          if version != os.environ["VERSION"]:
              raise SystemExit("VERSION must match workspace.package.version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nsha={os.environ['EXPECTED_SHA']}\n")
          PY
      - name: Validate embedded updater public key
        env:
          HERDR_UPDATE_PUBLIC_KEY: ${{ vars.HERDR_UPDATE_PUBLIC_KEY }}
        run: python3 scripts/update-manifest.py validate-public-key

  macos-checks:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Test release scripts and security contracts without credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
          jq --version
          python3 -m unittest discover -s scripts/release/tests -v
          python3 scripts/release/test-release-security.py
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl" python3 -m unittest discover -s scripts -p 'test_update_manifest.py' -v
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --all-features

  macos-build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      TARGET: ${{ matrix.target }}
      HERDR_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      HERDR_UPDATE_PUBLIC_KEY: ${{ vars.HERDR_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - run: rustup show
      - run: cargo build --locked --release -p herdr-gpui --target "$TARGET"
      - run: cargo test --locked --release -p herdr-gpui --test cli --target "$TARGET"
      # cargo-about gates its binary behind the non-default `cli` feature, and
      # `cargo install` only warns and exits 0 when it installs nothing. Verify
      # the subcommand resolves here rather than failing in the next step.
      - name: Install the notice generator
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo about --version
      - run: python3 scripts/release/generate-notices.py "target/$TARGET/release/THIRD-PARTY-NOTICES.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4, Arbor/Moltis
        with:
          name: macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/herdr-gpui
            target/${{ matrix.target }}/release/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}
      HERDR_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      HERDR_UPDATE_PUBLIC_KEY: ${{ vars.HERDR_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Install GPUI build dependencies
        run: bash scripts/install-linux-deps.sh
      - run: rustup show
      - name: Require the declared native target
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --all-features
      - run: cargo build --locked --release -p herdr-gpui --target "$TARGET"
      - run: cargo test --locked --release -p herdr-gpui --test cli --target "$TARGET"
      # cargo-about gates its binary behind the non-default `cli` feature, and
      # `cargo install` only warns and exits 0 when it installs nothing. Verify
      # the subcommand resolves here rather than failing in the next step.
      - name: Install the notice generator
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo about --version
      - run: python3 scripts/release/generate-notices.py "target/$TARGET/release/THIRD-PARTY-NOTICES.txt"
      - name: Package experimental Linux executable
        run: |
          mkdir dist
          bash scripts/release/package-linux.sh "$VERSION" "$TARGET" "target/$TARGET/release/herdr-gpui" dist "target/$TARGET/release/THIRD-PARTY-NOTICES.txt"
          python3 scripts/update-manifest.py package-linux "target/$TARGET/release/herdr-gpui" "$TARGET" "$VERSION" \
            "dist/herdr-gpui-$VERSION-$TARGET-update.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-package-${{ matrix.target }}
          path: |
            dist/Herdr-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/herdr-gpui-${{ needs.validate.outputs.version }}-${{ matrix.target }}-update.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows-protocol:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - run: rustup show
      - run: cargo test --locked -p herdr-protocol

  metadata:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - name: Generate locked release-platform graph including build dependencies
        run: |
          mkdir dist
          chmod +x scripts/release/cargo-locked.sh
          python3 scripts/release/generate-sbom.py "dist/Herdr-$VERSION.cdx.json"
          git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: dist/Herdr-${{ needs.validate.outputs.version }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [validate, macos-checks, macos-build, linux, windows-protocol]
    if: >-
      github.repository == 'penso/herdr-gpui' && github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      # No token/run-id override: artifacts can only come from this workflow run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-arm64
          path: binaries/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-x86_64
          path: binaries/x86_64
      - name: Assemble without executing the downloaded binaries
        run: |
          mkdir dist
          chmod +x binaries/arm64/herdr-gpui binaries/x86_64/herdr-gpui
          cmp binaries/arm64/THIRD-PARTY-NOTICES.txt binaries/x86_64/THIRD-PARTY-NOTICES.txt
          bash scripts/release/package-macos.sh "$VERSION" binaries/arm64/herdr-gpui binaries/x86_64/herdr-gpui dist binaries/arm64/THIRD-PARTY-NOTICES.txt
      - name: Sign and notarize app and DMG (never launch the app)
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: bash scripts/release/sign-macos.sh "$VERSION" dist/Herdr.app dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-package-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-package-aarch64-unknown-linux-gnu
          path: dist
      - name: Generate and verify signed update manifest
        env:
          HERDR_UPDATE_PUBLIC_KEY: ${{ vars.HERDR_UPDATE_PUBLIC_KEY }}
          HERDR_UPDATE_SIGNING_KEY: ${{ secrets.HERDR_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          set +x
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          "$OPENSSL" version | grep -q '^OpenSSL 3\.'
          umask 077
          KEY_DIR="$(mktemp -d "$RUNNER_TEMP/update-key.XXXXXX")"
          trap 'rm -rf "$KEY_DIR"' EXIT
          test -n "$HERDR_UPDATE_SIGNING_KEY"
          printf '%s' "$HERDR_UPDATE_SIGNING_KEY" > "$KEY_DIR/private.pem"
          unset HERDR_UPDATE_SIGNING_KEY
          python3 scripts/update-manifest.py check-key "$OPENSSL" "$KEY_DIR/private.pem"
          python3 scripts/update-manifest.py create dist "$VERSION" --require-all-targets
          "$OPENSSL" pkeyutl -sign -rawin -inkey "$KEY_DIR/private.pem" -passin pass: \
            -in dist/update-manifest.json -out dist/update-manifest.sig
          "$OPENSSL" pkey -in "$KEY_DIR/private.pem" -passin pass: -pubout -out "$KEY_DIR/public.pem"
          "$OPENSSL" pkeyutl -verify -rawin -pubin -inkey "$KEY_DIR/public.pem" \
            -in dist/update-manifest.json -sigfile dist/update-manifest.sig
          test "$(wc -c < dist/update-manifest.sig | tr -d ' ')" = 64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-signed
          path: |
            dist/Herdr-${{ needs.validate.outputs.version }}-universal-apple-darwin.dmg
            dist/herdr-gpui-${{ needs.validate.outputs.version }}-macos-universal.app.tar.gz
            dist/update-manifest.json
            dist/update-manifest.sig
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: [validate, sign, linux, metadata]
    if: >-
      github.repository == 'penso/herdr-gpui' && github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-signed
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-package-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-package-aarch64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: dist
      - run: python3 scripts/release/artifact-manifest.py base "$VERSION" dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Deliberately execute the action from the already SHA-validated checkout.
      - uses: ./.github/actions/sign-artifacts # zizmor: ignore[self-repository]
        with:
          working-directory: dist
          files: Herdr-${{ needs.validate.outputs.version }}-universal-apple-darwin.dmg Herdr-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz Herdr-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz Herdr-${{ needs.validate.outputs.version }}.cdx.json herdr-gpui-${{ needs.validate.outputs.version }}-macos-universal.app.tar.gz herdr-gpui-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu-update.tar.gz herdr-gpui-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu-update.tar.gz update-manifest.json update-manifest.sig
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Herdr-${{ needs.validate.outputs.version }}-universal-apple-darwin.dmg
            dist/Herdr-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            dist/Herdr-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz
            dist/Herdr-${{ needs.validate.outputs.version }}.cdx.json
            dist/herdr-gpui-${{ needs.validate.outputs.version }}-macos-universal.app.tar.gz
            dist/herdr-gpui-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu-update.tar.gz
            dist/herdr-gpui-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu-update.tar.gz
            dist/update-manifest.json
            dist/update-manifest.sig
      - run: python3 scripts/release/artifact-manifest.py create "$VERSION" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, attest]
    if: >-
      github.repository == 'penso/herdr-gpui' && github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      GH_REPO: penso/herdr-gpui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - run: python3 scripts/release/artifact-manifest.py verify "$VERSION" dist
      - name: Refuse existing tag or release, then create immutable tag and draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.error, urllib.request
          tag = "v" + os.environ["VERSION"]
          for path in (f"git/ref/tags/{tag}", f"releases/tags/{tag}"):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/penso/herdr-gpui/{path}",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json"})
              try:
                  urllib.request.urlopen(request).close()
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              else:
                  raise SystemExit(f"Refusing existing {path}")
          PY
          gh api repos/penso/herdr-gpui/git/refs -X POST \
            -f "ref=refs/tags/v$VERSION" -f "sha=$RELEASE_SHA"
          gh release create "v$VERSION" --verify-tag --target "$RELEASE_SHA" --draft \
            --title "Herdr GPUI $VERSION" \
            --notes "GUI-only release. macOS 15+ universal signed/notarized DMG; experimental Ubuntu 24.04 x86_64 and ARM64 archives. Requires an existing Herdr daemon. Source: $RELEASE_SHA." \
            dist/*
      - name: Verify uploaded draft bytes and exact asset set before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=$(python3 scripts/release/artifact-manifest.py names "$VERSION" dist | jq -R . | jq -s .)
          gh release view "v$VERSION" --json isDraft,assets | \
            jq -e --argjson expected "$expected" \
              '.isDraft and (([.assets[].name] | sort) == ($expected | sort))'
          gh release download "v$VERSION" --dir verified
          cmp dist/SHA256SUMS verified/SHA256SUMS
          python3 scripts/release/artifact-manifest.py verify "$VERSION" verified
          [[ "$(gh api "repos/penso/herdr-gpui/git/ref/tags/v$VERSION" --jq .object.sha)" == "$RELEASE_SHA" ]]
          gh release edit "v$VERSION" --draft=false

  homebrew:
    needs: [validate, publish]
    if: >-
      github.repository == 'penso/herdr-gpui' && github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: homebrew
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_REPO: penso/herdr-gpui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Download published final DMG and validate its published checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --json isDraft | jq -e '.isDraft == false'
          [[ "$(gh api "repos/penso/herdr-gpui/git/ref/tags/v$VERSION" --jq .object.sha)" == "$RELEASE_SHA" ]]
          gh release download "v$VERSION" --dir final \
            --pattern "Herdr-$VERSION-universal-apple-darwin.dmg" --pattern SHA256SUMS
          checksum=$(python3 scripts/release/artifact-manifest.py dmg "$VERSION" final)
          bash scripts/release/render-cask.sh "$VERSION" "$checksum" > rendered-cask.rb
      - name: Commit only the tap cask using its dedicated deploy key
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: bash scripts/release/update-homebrew.sh "$VERSION" rendered-cask.rb
