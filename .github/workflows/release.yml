name: Release

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9][0-9]"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package without signing, notarizing, or publishing"
        required: false
        default: true
        type: boolean

# Deny by default; every job below declares the scopes it actually needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

jobs:
  # Gates everything: a workflow change that leaks the Apple certificate or the
  # release token is caught before any secret is loaded into a runner.
  zizmor:
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@135698455da5c3b3e55f73f4419e481ab68cdd95 # v0.4.1
        with:
          advanced-security: false
          online-audits: false

  validate-tag:
    name: Validate Tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check tag matches YYYYMMDD.NN
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]{8}\.[0-9]{2}$ ]]; then
            echo "::error::Tag '$TAG' must match YYYYMMDD.NN"
            exit 1
          fi
          # Reject an impossible date early rather than shipping it in a bundle version.
          if ! date -d "${TAG%%.*}" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not start with a real YYYYMMDD date"
            exit 1
          fi

  validate-sparkle:
    name: Validate Sparkle Configuration
    needs: [zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require release keys and validate public key
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ env.RELEASE_DRY_RUN != 'true' && secrets.SPARKLE_PRIVATE_KEY || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import binascii
          import os
          import sys

          def fail(message):
              sys.exit(f"::error::{message} See docs/updating.md.")

          public = os.environ["SPARKLE_PUBLIC_ED_KEY"]
          release = os.environ["RELEASE_DRY_RUN"] != "true"
          if not public:
              if release:
                  fail("Set repository variable SPARKLE_PUBLIC_ED_KEY before releasing.")
              print("Dry run: no public key; bundle will omit updater configuration.")
          else:
              try:
                  decoded = base64.b64decode(public, validate=True)
              except (ValueError, binascii.Error):
                  fail("SPARKLE_PUBLIC_ED_KEY must be a base64-encoded Ed25519 public key.")
              if len(decoded) != 32 or base64.b64encode(decoded).decode() != public:
                  fail("SPARKLE_PUBLIC_ED_KEY must be canonical base64 encoding of 32 bytes.")
          if release and not os.environ["SPARKLE_PRIVATE_KEY"].strip():
              fail("Set secret SPARKLE_PRIVATE_KEY to generate_keys -x exported contents before releasing.")
          PY

  build:
    name: Build (${{ matrix.arch }})
    needs: [zizmor, validate-sparkle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show

      # No dependency cache here on purpose. A published binary should be built
      # from source every time: a poisoned cache entry restored into a release
      # build would be signed and notarized along with everything else.
      - name: Build optimized native executable
        env:
          HERDR_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '00000000.00' }}
        run: cargo build --locked --release -p herdr-gpui

      - name: Exercise release executable without opening a window
        env:
          HERDR_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '00000000.00' }}
        run: cargo test --locked --release -p herdr-gpui --test cli

      - name: Stage executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p staging
          cp target/release/herdr-gpui "staging/herdr-gpui-${TARGET}"
          # Fail loudly if the runner produced the wrong architecture.
          file "staging/herdr-gpui-${TARGET}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: executable-${{ matrix.arch }}
          path: staging/herdr-gpui-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package, Sign, and Notarize
    needs: [build, validate-tag]
    # validate-tag is skipped on workflow_dispatch; don't let that skip packaging.
    if: ${{ always() && needs.build.result == 'success' && needs.validate-tag.result != 'failure' }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing
      attestations: write # Build provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
          pattern: executable-*
          merge-multiple: true

      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$REF_NAME"
          else
            VERSION="00000000.00"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging version $VERSION"

      - name: Fetch verified Sparkle framework and tools
        run: bash scripts/fetch-sparkle.sh "$RUNNER_TEMP/sparkle"

      - name: Build universal executable and app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          ARM="artifacts/herdr-gpui-aarch64-apple-darwin"
          X86="artifacts/herdr-gpui-x86_64-apple-darwin"
          for f in "$ARM" "$X86"; do
            [ -f "$f" ] || { echo "::error::missing built executable $f"; exit 1; }
            chmod +x "$f"
          done

          APP="dist/Herdr.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          ditto "$RUNNER_TEMP/sparkle/Sparkle.framework" "$APP/Contents/Frameworks/Sparkle.framework"

          # One bundle that runs natively on both architectures.
          lipo -create -output "$APP/Contents/MacOS/Herdr" "$ARM" "$X86"
          lipo -info "$APP/Contents/MacOS/Herdr"
          chmod +x "$APP/Contents/MacOS/Herdr"

          cp assets/macos/Info.plist "$APP/Contents/Info.plist"
          cp assets/icons/Herdr.icns "$APP/Contents/Resources/Herdr.icns"
          cp "$RUNNER_TEMP/sparkle/LICENSE" "$APP/Contents/Resources/Sparkle-LICENSE"

          # The checked-in plist carries the Cargo version; stamp the release tag
          # so a downloaded build reports what it actually is.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP/Contents/Info.plist"
          # Rust loads Sparkle from the main bundle; local checked-in plists stay updater-free.
          if [[ -n "$SPARKLE_PUBLIC_ED_KEY" ]]; then
            /usr/libexec/PlistBuddy -c 'Add :SUFeedURL string https://github.com/penso/herdr-gpui/releases/latest/download/appcast.xml' "$APP/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string $SPARKLE_PUBLIC_ED_KEY" "$APP/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :SUEnableAutomaticChecks bool YES' "$APP/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :SUAutomaticallyUpdate bool NO' "$APP/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c 'Set :SUAllowsAutomaticUpdates NO' "$APP/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :SUVerifyUpdateBeforeExtraction bool YES' "$APP/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :SURequireSignedFeed bool YES' "$APP/Contents/Info.plist"
          elif [[ "$RELEASE_DRY_RUN" != 'true' ]]; then
            echo '::error::SPARKLE_PUBLIC_ED_KEY is required for release packaging'
            exit 1
          fi
          plutil -lint "$APP/Contents/Info.plist"

          # Per-architecture tarballs for people who only want the executable.
          mkdir -p dist
          cp "$ARM" "dist/herdr-gpui-${VERSION}-aarch64-apple-darwin"
          cp "$X86" "dist/herdr-gpui-${VERSION}-x86_64-apple-darwin"
          ( cd dist && tar -czf "herdr-gpui-${VERSION}-aarch64-apple-darwin.tar.gz" "herdr-gpui-${VERSION}-aarch64-apple-darwin" )
          ( cd dist && tar -czf "herdr-gpui-${VERSION}-x86_64-apple-darwin.tar.gz" "herdr-gpui-${VERSION}-x86_64-apple-darwin" )
          rm -f "dist/herdr-gpui-${VERSION}-aarch64-apple-darwin" "dist/herdr-gpui-${VERSION}-x86_64-apple-darwin"

      - name: Import Apple Developer ID certificate
        if: ${{ env.RELEASE_DRY_RUN != 'true' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm -f "$CERTIFICATE_PATH"

      - name: Code-sign app bundle
        if: ${{ env.RELEASE_DRY_RUN != 'true' }}
        run: |
          set -euo pipefail
          # Identity is matched by prefix against the freshly created keychain,
          # which holds exactly the one certificate imported above.
          #
          # Sign inside out, never with --deep. Preserve the distribution's
          # Downloader entitlements rather than stripping or guessing them.
          FRAMEWORK="dist/Herdr.app/Contents/Frameworks/Sparkle.framework"
          /usr/bin/codesign --force --timestamp --options runtime \
            --preserve-metadata=entitlements --sign "Developer ID Application" \
            "$FRAMEWORK/Versions/B/XPCServices/Downloader.xpc"
          for component in \
            "$FRAMEWORK/Versions/B/XPCServices/Installer.xpc" \
            "$FRAMEWORK/Versions/B/Autoupdate" \
            "$FRAMEWORK/Versions/B/Updater.app" \
            "$FRAMEWORK"; do
            /usr/bin/codesign --force --timestamp --options runtime \
              --sign "Developer ID Application" "$component"
          done
          # Hardened runtime with no entitlements for Herdr: the client opens a Unix socket
          # and draws with Metal, and needs no relaxed-security exception.
          /usr/bin/codesign --force --timestamp --options runtime \
            --sign "Developer ID Application" \
            dist/Herdr.app

          /usr/bin/codesign --verify --deep --strict --verbose=2 dist/Herdr.app

      - name: Package app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # ditto, not zip: preserves the signature and bundle metadata.
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Herdr.app "dist/herdr-gpui-${VERSION}-macos-universal.app.zip"

      # An App Store Connect API key, not an Apple ID and app-specific password.
      # An app-specific password is not scoped to notarization: it bypasses its
      # owner's two-factor auth and grants IMAP/CalDAV access to their iCloud
      # mail, contacts and calendar. An API key is team-owned, carries only the
      # role it was granted, and is revoked on its own. Apple says the same in
      # TN3147; so does docs/guide/02-running-it.md in seneschal.
      - name: Notarize and staple
        if: ${{ env.RELEASE_DRY_RUN != 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          ZIP="dist/herdr-gpui-${VERSION}-macos-universal.app.zip"

          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          (umask 077 && printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH")

          NOTARY_AUTH=(--key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")

          SUBMIT_OUT="$(xcrun notarytool submit "$ZIP" "${NOTARY_AUTH[@]}" --wait 2>&1)" || true
          echo "$SUBMIT_OUT"

          SUBMISSION_ID="$(echo "$SUBMIT_OUT" | awk '/^ *id: /{print $2; exit}')"
          if ! echo "$SUBMIT_OUT" | grep -q 'status: Accepted'; then
            echo "::error::Notarization did not succeed"
            [ -n "$SUBMISSION_ID" ] && xcrun notarytool log "$SUBMISSION_ID" \
              "${NOTARY_AUTH[@]}" || true
            exit 1
          fi

          # Staple the ticket so the app validates without a network round trip,
          # then re-package: the stapled bundle differs from the submitted one.
          xcrun stapler staple dist/Herdr.app
          xcrun stapler validate dist/Herdr.app
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent dist/Herdr.app "$ZIP"

          # Prove Gatekeeper actually accepts what we are about to publish.
          spctl --assess --type execute --verbose=4 dist/Herdr.app

      - name: Generate and verify signed Sparkle appcast
        if: ${{ env.RELEASE_DRY_RUN != 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          # Only the final notarized/stapled ZIP goes into this fresh directory.
          # Never ingest an old feed, executable tarballs, or cached delta files.
          FEED_DIR="$(mktemp -d "$RUNNER_TEMP/sparkle-feed.XXXXXX")"
          trap 'rm -rf "$FEED_DIR"' EXIT
          cp "dist/herdr-gpui-${VERSION}-macos-universal.app.zip" "$FEED_DIR/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - --maximum-versions 1 --maximum-deltas 0 \
            --download-url-prefix "https://github.com/penso/herdr-gpui/releases/download/${VERSION}/" \
            "$FEED_DIR"
          # Verification does not rewrite the signed feed bytes.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" \
            --ed-key-file - --verify "$FEED_DIR/appcast.xml"
          # generate_appcast only warns on a public/private key mismatch and
          # omits the enclosure signature. Reject that output before publishing.
          python3 - "$FEED_DIR" <<'PY'
          import base64
          import os
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          directory = Path(sys.argv[1])
          version = os.environ["VERSION"]
          archive = directory / f"herdr-gpui-{version}-macos-universal.app.zip"
          ns = {"sparkle": "http://www.andymatuschak.org/xml-namespaces/sparkle"}
          items = ET.parse(directory / "appcast.xml").findall("./channel/item")
          if len(items) != 1 or items[0].findtext("sparkle:version", namespaces=ns) != version:
              sys.exit("::error::Appcast must contain exactly the current release version")
          item = items[0]
          enclosure = item.find("enclosure")
          if enclosure is None or item.find("sparkle:deltas", ns) is not None:
              sys.exit("::error::Appcast must contain a full archive and no deltas")
          signature = enclosure.get(f"{{{ns['sparkle']}}}edSignature", "")
          if not signature or len(base64.b64decode(signature, validate=True)) != 64:
              sys.exit("::error::Missing archive signature; check SPARKLE_PRIVATE_KEY matches SPARKLE_PUBLIC_ED_KEY")
          expected_url = f"https://github.com/penso/herdr-gpui/releases/download/{version}/{archive.name}"
          if enclosure.get("url") != expected_url or enclosure.get("length") != str(archive.stat().st_size):
              sys.exit("::error::Appcast does not reference the final version-specific ZIP")
          PY
          cp "$FEED_DIR/appcast.xml" dist/appcast.xml

      - name: Generate SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked --version 0.5.9
          # Emits one SBOM per workspace member next to its Cargo.toml; the
          # application crate's is the one that describes a shipped artifact.
          cargo cyclonedx --format json --spec-version 1.5 --all \
            --target aarch64-apple-darwin \
            --override-filename sbom
          cp crates/herdr-gpui/sbom.json "dist/herdr-gpui-${VERSION}.cdx.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d['components']), 'components')" \
            "dist/herdr-gpui-${VERSION}.cdx.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Generate checksums and Sigstore signatures
        uses: ./.github/actions/sign-artifacts
        with:
          working-directory: dist
          files: "*.app.zip *.tar.gz *.cdx.json appcast.xml"

      - name: Attest build provenance
        if: ${{ env.RELEASE_DRY_RUN != 'true' }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.app.zip
            dist/*.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/*.app.zip
            dist/*.tar.gz
            dist/*.cdx.json
            dist/appcast.xml
            dist/*.sha256
            dist/*.sha512
            dist/*.sig
            dist/*.crt
          if-no-files-found: error
          retention-days: 7

      - name: Clean up signing keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  publish:
    name: Publish Release
    needs: [package]
    if: ${{ startsWith(github.ref, 'refs/tags/') && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Create the release and upload assets
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          DRY_RUN: ${{ env.RELEASE_DRY_RUN }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: skipping release creation"
            ls -la dist
            exit 0
          fi
          test -s dist/appcast.xml || { echo '::error::Signed appcast.xml is missing; refusing to publish'; exit 1; }

          {
            echo "Native macOS client for Herdr. Requires a running Herdr daemon."
            echo
            echo "## Install"
            echo
            echo "Download \`herdr-gpui-${VERSION}-macos-universal.app.zip\`, unzip, and move"
            echo "\`Herdr.app\` to /Applications. The bundle is a universal binary, signed with a"
            echo "Developer ID certificate and notarized by Apple, so Gatekeeper opens it directly."
            echo
            echo "## Verify"
            echo
            echo "Every asset ships \`.sha256\`, \`.sha512\`, and a Sigstore keyless signature"
            echo "(\`.sig\` + \`.crt\`). Builds also carry GitHub provenance attestation:"
            echo
            echo '```sh'
            echo "shasum -a 256 -c herdr-gpui-${VERSION}-macos-universal.app.zip.sha256"
            echo "gh attestation verify herdr-gpui-${VERSION}-macos-universal.app.zip --repo ${REPO}"
            echo '```'
            echo
            echo "Detached GPG signatures (\`.asc\`) from the maintainer's key are added shortly"
            echo "after publication; the key is not held by CI. Verify them with"
            echo "\`./scripts/verify-release.sh --version ${VERSION} --checksums\`."
            echo
            echo "A CycloneDX SBOM of the dependency graph is attached as \`.cdx.json\`."
          } > notes.md

          gh release create "$VERSION" \
            --repo "$REPO" \
            --title "$VERSION" \
            --latest \
            --notes-file notes.md \
            dist/*
