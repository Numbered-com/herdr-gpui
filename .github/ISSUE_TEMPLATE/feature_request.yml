name: Feature request
description: Suggest a capability for the GUI client
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the *Next Milestones* section of the README first — several
        obvious gaps (selection/copy, resizable sidebar, automatic reconnect,
        signed packaging) are already planned.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task that is hard today, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
    validations:
      required: true

  - type: textarea
    id: tui-parity
    attributes:
      label: Does Herdr's TUI already do this?
      description: If so, how it behaves there — the GUI generally follows the TUI's semantics.
